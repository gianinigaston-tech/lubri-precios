<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"></head><body><title>Precios El Lubri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style id="css">
/* Mostrador de taller: cabecera negra con logo y franja naranja, barra de forma de pago fija, lista con carrito */
:root{
  --bg:#0e0d0c; --surface:#181614; --surface-2:#221f1c; --line:#35302b;
  --fg:#f6f0e9; --muted:#a89d92; --accent:#ff5500; --accent-2:#ff7a1a; --accent-soft:#3a1b08; --accent-ink:#1b0800;
  --ok:#62d29b; --ok-soft:#12301f; --danger:#ff6b5b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}

header{background:#000;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand img{height:54px;width:auto;flex:none;display:block}
.brand-text{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:3px 0 0;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.92rem;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}

main{padding-block:14px 110px}
.pane{display:grid;gap:12px}

/* Barra de forma de pago */
.paybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:10px 0 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.modes{display:grid;grid-template-columns:1.7fr 1.4fr repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.modes button{border:0;background:transparent;border-radius:9px;padding:6px 2px;display:grid;line-height:1.05;color:var(--muted);min-width:0}
.modes button b{font-family:var(--display);font-size:1.15rem;color:var(--fg);font-weight:700}
.modes button small{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
.modes button[aria-pressed="true"]{background:var(--accent)}
.modes button[aria-pressed="true"] b,.modes button[aria-pressed="true"] small{color:#fff}
.modes .sep{border-left:1px solid var(--line)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem}
.toggle[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.toggle i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:inline-block}
.toggle[aria-pressed="true"] i{background:currentColor}

.search-box{position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
#q{width:100%;padding:13px 14px 13px 44px;font-size:1.06rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none}
#q:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.input{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.input:focus,select:focus{border-color:var(--accent);outline:none}
.meta{color:var(--muted);font-size:.85rem}

.results{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item.open{border-color:var(--accent)}
.item.picked{box-shadow:inset 4px 0 0 var(--accent)}
.item-row{display:flex;align-items:stretch}
.pick{flex:none;width:52px;border:0;background:transparent;display:grid;place-items:center;border-right:1px solid var(--line)}
.pick span{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.pick[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent)}
.pick svg{opacity:0}
.pick[aria-pressed="true"] svg{opacity:1}
.item-head{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;text-align:left;border:0;background:transparent;padding:11px 14px}
.item-main{flex:1;min-width:0;display:grid;gap:3px}
.btn.more{width:100%;margin-top:4px}
.item-foot{flex-basis:100%;display:grid;gap:3px 12px;border-top:1px dashed var(--line);padding-top:6px;align-items:center}
.item-foot.has-img{grid-template-columns:auto 1fr}
.item-foot .thumb{grid-row:span 2;width:56px;height:56px}
.thumb{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.big-img{max-width:100%;max-height:240px;background:#fff;border-radius:10px;justify-self:start;object-fit:contain}
.item-desc{font-weight:600;line-height:1.25;overflow-wrap:break-word}
.item-meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.item-meta .brand-m{text-transform:uppercase;letter-spacing:.06em;font-size:.74rem}
.item-meta .brand-m b{font-weight:800;color:var(--fg);font-size:.86rem;letter-spacing:.03em}
.item-prov{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.item-prov b{color:var(--accent-2);font-weight:800}
.item-meta .code{font-variant-numeric:tabular-nums;color:var(--fg);opacity:.8}
.item-price{text-align:right;flex:none;display:grid}
.item-price small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item-price b{font-family:var(--display);font-size:1.45rem;font-weight:700;color:var(--accent-2);font-variant-numeric:tabular-nums;line-height:1.05}
.item-price em{font-style:normal;font-size:.82rem;color:var(--fg);font-variant-numeric:tabular-nums}
.na{color:var(--muted);font-size:.85rem}
.detail{border-top:1px dashed var(--line);padding:12px 14px 14px;display:grid;gap:10px;background:var(--surface-2)}
.plans{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.plans th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:4px 0}
.plans th:first-child,.plans td:first-child{text-align:left}
.plans td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.plans td:first-child{font-weight:600}
.plans td.total{font-weight:700;font-size:1.05rem}
.plans tr.cur td{color:var(--accent-2)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:middle}
.base{margin:0;font-size:.78rem;color:var(--muted)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-size:1.3rem;letter-spacing:.02em}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;color:#ffd2b0}

/* Carrito */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.cartbar button{width:100%;max-width:728px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:700;text-align:left}
.cartbar .n{background:#000;color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.85rem;padding:0 7px}
.cartbar .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartbar .t{white-space:nowrap;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.cart-list{display:grid;gap:6px}
.cart-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-row .d{font-weight:600;line-height:1.25}
.cart-row .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.totals{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.trow span{color:var(--muted)}
.trow b{font-variant-numeric:tabular-nums;font-size:1.1rem}
.trow.big b{font-family:var(--display);font-size:1.7rem;color:var(--accent-2)}

/* Admin */
h2{margin:6px 0 0;font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.02em;text-transform:uppercase}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.views button{border:0;border-radius:9px;padding:10px 8px;font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sueltos{display:grid;gap:10px}
.suelto{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.suelto.picked{border-color:var(--accent)}
.suelto-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.suelto-top .item-desc{font-weight:700}
.suelto-lit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.suelto-lit .input{width:96px;font-size:1.05rem;font-weight:700;text-align:center}
.suelto-lit .tot{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.suelto-lit .tot b{display:block;font-size:1.2rem;color:var(--accent-2)}
.sedit{display:grid;grid-template-columns:1fr 110px 110px auto;gap:6px;align-items:end}
@media (max-width:560px){.sedit{grid-template-columns:1fr 1fr}.sedit .field:first-child{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.field .input,.field select{color:var(--fg);font-size:1rem}
.grow{flex:1 1 180px}
.pct{width:90px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700;background:var(--surface-2);border:1.5px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.prov-name{font-weight:700;font-size:1.08rem}
.check{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--fg)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.plan-grid{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.plan-grid .lbl{font-weight:600}
.plan-grid .row{flex-wrap:nowrap}
.savebar{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;justify-content:flex-end}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;align-items:end;justify-items:center}
.sheet-body{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:var(--surface);border-top:3px solid var(--accent);border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--fg)}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.prev{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.prev th,.prev td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prev td.d{white-space:normal;min-width:180px}
.prev th{color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.prev td.n{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
@media (max-width:420px){.modes button small{font-size:.56rem;letter-spacing:.02em}.modes button b{font-size:1rem}.modes button:nth-child(-n+2) b{font-size:.9rem}.brand img{height:46px}.toggle{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

/* Presupuesto: hoja blanca imprimible con cabecera negra (el logo tiene letras blancas) */
.pres-form{display:grid;gap:10px}
.pres-doc{background:#fff;color:#111;border-radius:10px;overflow:hidden;color-scheme:light}
.pres-head{background:#000;border-bottom:4px solid var(--accent);padding:14px 18px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.pres-head small{color:#fff;font-size:.74rem;text-align:center;letter-spacing:.02em;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 14px}
.pres-head small span{display:inline-flex;align-items:center;gap:5px}
.pres-head small img{width:15px;height:15px}
.pres-qr{display:flex;gap:16px;align-items:center;justify-content:center;border:1.5px solid var(--accent);border-radius:8px;padding:10px 18px;color:#111;width:fit-content;max-width:100%;margin:0 auto}
.pres-qr img{width:96px;height:96px;flex:none}
.pres-qr b{font-family:var(--display);font-size:1.4rem;letter-spacing:.04em;color:#111}
.pres-head>img{height:70px;width:auto}
.pres-head>span{font-family:var(--display);font-size:2rem;font-weight:700;color:#fff}
.pres-in{padding:16px 18px 20px;display:grid;gap:12px}
.pres-title{margin:0;font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:#111}
.pres-data{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:.95rem}
.pres-data dt{color:#666;font-weight:600}
.pres-data dd{margin:0;font-weight:600;border-bottom:1px dotted #aaa;min-height:1.3em}
.pres-num{margin:-8px 0 0;text-align:center;font-weight:700;color:#444;letter-spacing:.08em}
.pres-valid{margin:0;text-align:center;font-weight:700;font-size:.85rem;color:#111;letter-spacing:.06em}
.pres-warn{text-align:center;font-weight:700;letter-spacing:.08em;font-size:.85rem;border:1.5px solid #111;padding:6px;color:#111}
.pres-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem;color:#111}
.pres-tbl th{text-align:right;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#666;border-bottom:2px solid #111;padding:4px 0 4px 8px;font-weight:600}
.pres-tbl td{text-align:right;padding:7px 0 7px 8px;border-bottom:1px solid #ddd;vertical-align:top;white-space:nowrap}
.pres-tbl th:first-child,.pres-tbl td:first-child{text-align:left;padding-left:0;white-space:normal}
.pres-tbl td small{display:block;color:#777;font-size:.74rem}
.pres-line{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:#111;margin:0}
.pres-tot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#111;color:#fff;padding:10px 12px;border-radius:6px;font-weight:600}
.pres-tot b{font-family:var(--display);font-size:1.7rem;color:var(--accent-2);white-space:nowrap}
.pres-sub{font-weight:700;margin:4px 0 0;color:#111}
.pres-foot{font-size:.75rem;color:#777;text-align:center;margin:0}
#printArea{display:none}
@media print{
  @page{margin:12mm}
  html,body{background:#fff!important}
  body::before{display:none!important}
  #app>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .pres-doc{border-radius:0}
  .pres-head,.pres-tot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script id="appjs">
const RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
const TOP = '<title>Precios El Lubri</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">\n';
const SCR = 'scr' + 'ipt';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const fmt = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const clone = o => JSON.parse(JSON.stringify(o));
const CUOTAS = [1, 3, 6, 9, 12];
const store = (kind) => { try { return window[kind]; } catch (e) { return null; } };
const lsGet = k => { try { return store('localStorage').getItem('lubri_' + k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { store('localStorage').setItem('lubri_' + k, v); } catch (e) {} };
const ssGet = k => { try { const v = store('sessionStorage').getItem('lubri_' + k); store('sessionStorage').removeItem('lubri_' + k); return v; } catch (e) { return null; } };
const ssSet = (k, v) => { try { store('sessionStorage').setItem('lubri_' + k, v); } catch (e) {} };

/* ---------- Estado publicado (vive dentro de la página) ---------- */
let ST;
try { ST = JSON.parse($('#state').textContent); } catch (e) { ST = {}; }
ST.cfg = { nombre: 'El Lubri', redondeo: 100, debito: 0, regular: 10, ...(ST.cfg || {}) };
ST.bancos = ST.bancos || [];
ST.provs = ST.provs || [];
ST.sueltos = ST.sueltos || [];

function buildDoc(st) {
  const json = JSON.stringify(st).replace(/</g, '\\u003c');

    + '<' + SCR + ' type="application/json" id="state">' + json + '</' + SCR + '>\n'
    + '<' + SCR + ' id="appjs">' + $('#appjs').textContent + '</' + SCR + '>\n</body></html>';
}

/* ---------- Estado de la vista (de cada compu) ---------- */
let cartSaved = [];
try { cartSaved = JSON.parse(lsGet('cart') || '[]'); } catch (e) {}
const S = {
  canEdit: false, art: null, sample: null,
  tab: 'precios', view: lsGet('view') === 'suelto' ? 'suelto' : 'prod', q: '', provFilter: '', open: null, limit: 60, lit: {}, draftSue: null,
  mode: lsGet('mode') || 'ef', banco: lsGet('banco') || '', regular: lsGet('regular') === '1',
  cart: Array.isArray(cartSaved) ? cartSaved : [], cartOpen: false, presOpen: false,
  pres: { cli: '', veh: '', deb: false, cuo: false, banco: '', num: '' },
  dirty: { tar: false, aj: false }, draftTar: null, editProv: null, confirmDel: null, imp: null, saving: false,
  products: [],
};

/* ---------- Precios ---------- */
function redondear(v) { const r = Number(ST.cfg.redondeo) || 0; return r ? Math.ceil(v / r - 1e-9) * r : Math.round(v); }
function provOf(id) { return ST.provs.find(p => p.id === id); }
const SUELTO = '__suelto';
const provName = p => p.suelto ? 'Aceite suelto' : (provOf(p.p)?.nombre || '');
const litros = s => { const n = Number(String(s ?? '').replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; };
const fmtL = n => n.toLocaleString('es-AR', { maximumFractionDigits: 2 }) + ' L';
const cantTxt = (x, p) => p && p.suelto ? fmtL(x.q) : String(x.q);
function contado(p) {
  if (p.suelto) return Number(p.precio) || 0;
  const pv = provOf(p.p) || {};
  let base = p.precio;
  if (pv.iva === false) base *= 1.21;
  return redondear(base * (1 + Number(pv.margen ?? 30) / 100));
}
/* recargo de débito: el propio de la terminal si lo tiene, si no el general de Ajustes; null = no acepta débito */
function debitoPct(b) {
  if (b && b.deb === false) return null;
  if (b && b.deb !== undefined && b.deb !== null && b.deb !== '') return Number(b.deb) || 0;
  return Number(ST.cfg.debito) || 0;
}
function bancoActual() { return ST.bancos.find(b => b.id === S.banco) || ST.bancos[0] || null; }
function modeLabel(m, b) {
  if (m === 'ef') return 'Efectivo / transf.';
  if (m === 'deb') return 'Débito' + (b ? ' · ' + b.nombre : '');
  const c = Number(m);
  return (c === 1 ? '1 pago' : c + ' cuotas') + (b ? ' · ' + b.nombre : '');
}
/* monto contado -> precio final en esa forma de pago, con o sin descuento de cliente regular */
function precio(monto, m, b, regular) {
  let a = monto, plan = null;
  if (m === 'deb') {
    const d = debitoPct(b);
    if (d === null) return null;
    a = monto * (1 + d / 100);
  }
  else if (m !== 'ef') {
    const c = Number(m);
    plan = b && (b.planes || []).find(pl => pl.c === c);
    if (!plan || plan.on === false) return null;
    if (!plan.si) a = monto * (1 + (Number(plan.r) || 0) / 100);
  }
  if (regular) a *= 1 - (Number(ST.cfg.regular) || 0) / 100;
  const total = redondear(a);
  const c = plan ? plan.c : 1;
  return { total, c, cuota: total / c, si: !!(plan && plan.si) };
}

/* fotos de productos: viven en la página de GitHub (carpeta img/) */
const IMG_BASE = /github\.io$/.test(location.hostname) ? 'img/' : 'https://gianinigaston-tech.github.io/lubri-precios/img/';
const imgSrc = f => /^(https?:|data:)/.test(f) ? f : IMG_BASE + f;
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.dataset.ph) t.remove(); }, true);

function rebuild() {
  const out = [];
  for (const pv of ST.provs) {
    (pv.rows || []).forEach(r => {
      const [c, d, m, pr, img] = r;
      const precio = Number(pr);
      if (!d || !isFinite(precio)) return;
      out.push({ u: pv.id + '|' + (c || '') + '|' + d, p: pv.id, c: c || '', d, m: m || '', precio, img: img || '', k: norm([c, d, m, pv.nombre].join(' ')), kd: norm(d), kc: norm(c || ''), km: norm(m || '') });
    });
  }
  /* aceites sueltos: precio final por litro que pone el dueño; en el carrito la cantidad son litros */
  for (const s of ST.sueltos) {
    const precio = Number(s.litro);
    if (!s.nombre || !(precio > 0)) continue;
    out.push({ u: 'suelto|' + s.id, p: SUELTO, c: '', d: s.nombre, m: s.marca || '', precio, img: '', suelto: true, k: norm([s.nombre, s.marca, 'aceite suelto granel litro'].join(' ')), kd: norm(s.nombre), kc: '', km: norm(s.marca || '') });
  }
  out.sort((a, b) => a.d.localeCompare(b.d, 'es'));
  S.products = out;
  S.byU = new Map(out.map(p => [p.u, p]));
}

/* ---------- Pantalla principal ---------- */
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_CART = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H6.6"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>';

function shell() {
  $('#app').innerHTML = `
  <header>
    <div class="wrap">
      <div class="brand">
        ${ST.cfg.logo ? `<img src="${esc(ST.cfg.logo)}" alt="${esc(ST.cfg.nombre)}">` : ''}
        <div class="brand-text"><h1 id="nombre">${esc(ST.cfg.nombre)}</h1><p>Lista de precios</p></div>
      </div>
      <nav id="nav" role="tablist" hidden>
        <button role="tab" data-tab="precios" aria-selected="true">Precios</button>
        <button role="tab" data-tab="prov" aria-selected="false">Proveedores</button>
        <button role="tab" data-tab="tar" aria-selected="false">Tarjetas</button>

      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="pane" id="pane-precios">
      <div class="views" id="views" role="group" aria-label="Sección"><button data-view="prod" aria-pressed="true">Productos</button><button data-view="suelto" aria-pressed="false">Aceite suelto</button></div>

  <div class="toast" id="toast" hidden></div>
  <div id="printArea"></div>`;
}

function renderPaybar() {
  const modes = [['ef', 'Efectivo', 'y transf.'], ['deb', 'Débito', ''], ...CUOTAS.map(c => [String(c), String(c), c === 1 ? 'pago' : 'cuotas'])];
  const b = bancoActual();
  const isCard = S.mode !== 'ef';
  $('#modes').innerHTML = modes.map(([k, l, s], i) => `<button data-mode="${k}" aria-pressed="${S.mode === k}"${i === 2 ? ' class="sep"' : ''}><b>${l}</b><small>${s || '&nbsp;'}</small></button>`).join('');
  $('#bar2').innerHTML = `
      ${ST.bancos.length ? `<select id="bancoSel" aria-label="Banco, tarjeta o terminal"${isCard ? '' : ' style="opacity:.55"'}>${ST.bancos.map(x => `<option value="${esc(x.id)}"${b && x.id === b.id ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>` : ''}
      ${Number(ST.cfg.regular) ? `<button class="toggle" id="regBtn" aria-pressed="${S.regular}"><i></i>Cliente regular −${esc(ST.cfg.regular)}%</button>` : ''}`;
}

function renderFilter() {
  const sel = $('#provFilter');
  const provs = [...ST.provs].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  if (S.provFilter && !provOf(S.provFilter)) S.provFilter = '';
  sel.innerHTML = '<option value="">Todos los proveedores</option>' + provs.map(p => `<option value="${esc(p.id)}"${p.id === S.provFilter ? ' selected' : ''}>${esc(p.nombre)}</option>`).join('');
}

function renderAvisos() {
  const msgs = [];
  if (ST.cfg.tarjetasEjemplo) msgs.push('Los % de tarjetas son de EJEMPLO todavía. No los uses para cobrar hasta que se carguen los reales.');
  $('#avisos').innerHTML = msgs.map(m => `<div class="note">${esc(m)}</div>`).join('');
}

function priceCell(p) {
  const r = precio(contado(p), S.mode, bancoActual(), S.regular);
  if (!r) return `<span class="item-price"><small>${esc(modeLabel(S.mode))}</small><span class="na">No disponible</span></span>`;
  const sub = r.c > 1 ? `<em>${r.c} × ${fmt(r.cuota)}</em>` : '';
  return `<span class="item-price"><small>${esc(modeLabel(S.mode))}${r.si ? ' s/int' : ''}</small><b>${fmt(r.total)}</b>${sub}</span>`;
}

function renderResults() {
  const box = $('#results');
  if (!S.products.length) {
    box.innerHTML = `<div class="empty"><strong>Todavía no hay listas cargadas</strong><span>${S.canEdit ? 'Andá a <b>Proveedores</b>, creá uno y subí su lista en PDF o Excel.' : 'Cuando se cargue la primera lista de un proveedor, los precios aparecen acá.'}</span></div>`;
    $('#meta').textContent = '';
    return;
  }
  const toks = norm(S.q).split(/\s+/).filter(Boolean);
  let list = S.products;
  if (S.provFilter) list = list.filter(p => p.p === S.provFilter);
  if (toks.length) {
    const alts = toks.map(t => SINON[t] || [t]);
    list = list.filter(p => alts.every(al => al.some(t => p.k.includes(t))));
    list = list.map(p => [relevancia(p, toks), p]).sort((a, b) => b[0] - a[0] || a[1].d.localeCompare(b[1].d, 'es')).map(x => x[1]);
  }
  const shown = list.slice(0, S.limit);
  $('#meta').textContent = list.length > shown.length ? `Mostrando ${shown.length} de ${list.length.toLocaleString('es-AR')}` : `${list.length.toLocaleString('es-AR')} producto${list.length === 1 ? '' : 's'}`;
  if (!shown.length) { box.innerHTML = `<div class="empty"><strong>Sin resultados</strong><span>Probá con otra palabra, el código o la marca.</span></div>`; return; }

  const more = list.length > shown.length ? `<button class="btn more" data-act="more">Ver más (${(list.length - shown.length).toLocaleString('es-AR')} restantes)</button>` : '';
  box.innerHTML = shown.map(p => {
    const pv = provOf(p.p);
    const open = S.open === p.u, picked = inCart.has(p.u);
    return `<article class="item${open ? ' open' : ''}${picked ? ' picked' : ''}">
      <div class="item-row">
        <button class="pick" data-pick="${esc(p.u)}" aria-pressed="${picked}" aria-label="${picked ? 'Sacar del carrito' : 'Agregar al carrito'}"><span>${ICON_CHECK}</span></button>

}

/* marca en mayúscula y negrita; lo que viene después del " · " (rubro) queda normal */
function brandHTML(m) {
  if (!m) return '';
  const [marca, ...resto] = m.split(' · ');
  return `<span class="brand-m">Marca: <b>${esc(marca)}</b></span>${resto.length ? `<span>${esc(resto.join(' · '))}</span>` : ''}`;
}

/* palabras equivalentes que usan los proveedores */
const SINON = { aceite: ['aceite', 'oil'], combustible: ['combustible', 'comb'], nafta: ['nafta', 'naf'], habitaculo: ['habitaculo', 'habitac', 'cabina'], aire: ['aire', 'air'] };

/* puntaje de búsqueda: código exacto > palabra que empieza en la descripción > descripción > marca */
function relevancia(p, toks) {
  let sc = 0;
  for (const t of toks) {
    if (p.kc === t) sc += 50; else if (p.kc.startsWith(t)) sc += 20;
    if ((' ' + p.kd).includes(' ' + t)) sc += 10; else if (p.kd.includes(t)) sc += 5;
    if (p.km.includes(t)) sc += 3;
  }
  if (toks.length > 1 && p.kd.includes(toks.join(' '))) sc += 15;
  return sc;
}

/* Tabla con todas las formas de pago para un monto contado */
function tablaPagos(monto) {
  const b = bancoActual();
  const rows = [['ef'], ['deb'], ...CUOTAS.map(c => [String(c)])].map(([m]) => {
    const r = precio(monto, m, b, S.regular);
    if (!r) return '';
    const name = m === 'ef' ? 'Efectivo / transferencia' : m === 'deb' ? `Débito${S.canEdit && debitoPct(b) ? ` (+${debitoPct(b)}%)` : ''}` : (m === '1' ? '1 pago' : m + ' cuotas') + (r.si ? '<span class="tag">sin interés</span>' : '');
    return `<tr class="${S.mode === m ? 'cur' : ''}"><td>${name}</td><td>${r.c > 1 ? fmt(r.cuota) : '—'}</td><td class="total">${fmt(r.total)}</td></tr>`;
  }).join('');
  return `<table class="plans"><thead><tr><th>${b ? esc(b.nombre) : 'Forma de pago'}${S.regular ? ' · cliente regular' : ''}</th><th>Por cuota</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function detailHTML(p) {
  const pv = provOf(p.p);
  return `<div class="detail">
    ${p.img ? `<img class="big-img" data-ph="1" alt="${esc(p.d)}" src="${esc(imgSrc(p.img))}">` : ''}
    ${tablaPagos(contado(p))}
    ${S.canEdit && !p.suelto ? `<p class="base">Lista ${esc(pv.nombre)}: ${fmt(p.precio)}${pv.iva === false ? ' + IVA 21%' : ' (IVA incl.)'} · +${Number(pv.margen ?? 30)}% → contado ${fmt(contado(p))}</p>` : ''}
  </div>`;
}

function cartMonto() {

/* PDF del presupuesto, armado en el navegador con jsPDF (A4, texto real, no captura) */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let jspdfP = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jspdfP) jspdfP = new Promise((ok, ko) => {
    const s = document.createElement(SCR); s.src = JSPDF_URL;
    s.onload = () => window.jspdf ? ok(window.jspdf) : ko(new Error('jspdf'));
    s.onerror = () => { jspdfP = null; ko(new Error('jspdf')); };
    document.head.appendChild(s);
  });
  return jspdfP;
}
const pdfMoney = n => '$ ' + Math.round(n).toLocaleString('es-AR');

      });

    doc.setFont('helvetica', 'normal'); doc.setTextColor(110, 110, 110); doc.text(k, M, y);

    doc.setDrawColor(170, 170, 170); doc.setLineDashPattern([0.6, 0.8], 0); doc.line(M + 24, y + 1.6, R, y + 1.6); doc.setLineDashPattern([], 0);
    y += 6.5;
  });
  y += 0.5;
  doc.setDrawColor(17, 17, 17); doc.setLineWidth(0.4); doc.rect(M, y, R - M, 8);
  doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.text('DOCUMENTO NO VÁLIDO COMO FACTURA', W / 2, y + 5.4, { align: 'center', charSpace: 0.4 });
  y += 15;
  const C1 = 132, C2 = 160, C3 = R;

  items.forEach(({ x, p }) => {

    y += h; doc.setDrawColor(220, 220, 220); doc.line(M, y - 2.2, R, y - 2.2); y += 2;

/* ---------- Guardar (publica una versión nueva de la página) ---------- */
async function guardar(mutar, msg) {
  if (!S.art) { toast('Para guardar abrí la app desde tu cuenta de Claude.'); return false; }
  if (S.saving) return false;
  const next = clone(ST);
  mutar(next);
  S.saving = true;
  ssSet('tab', S.tab); ssSet('flash', msg || 'Guardado');
  try { await S.art.publish(buildDoc(next)); return true; }
  catch (e) {
    ssGet('flash');
    const code = e && e.code;
    if (code === 'conflict') toast('Había una versión más nueva. Se recarga, volvé a intentar.');
    else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') { toast('Esta vista es solo de consulta.'); S.canEdit = false; $('#nav').hidden = true; setTab('precios'); }
    else if (code === 'too_large') toast('Las listas ocupan demasiado. Borrá proveedores que no uses.');
    else if (code === 'rate_limited') toast('Muchos cambios seguidos. Esperá un minuto y guardá de nuevo.');
    else toast('No se pudo guardar. Probá de nuevo.');
    return false;
  } finally { S.saving = false; }
}

function loadScript(src) {

async function pdfPages(file, onPage) {
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false, disableFontFace: true, useSystemFonts: true }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    onPage(i, pdf.numPages);
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const lines = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let line = lines.find(l => Math.abs(l.y - y) < 3);
      if (!line) { line = { y, parts: [] }; lines.push(line); }
      line.parts.push({ x, w: it.width || 0, s: it.str });
    }
    lines.sort((a, b) => b.y - a.y);
    pages.push(lines.map(l => {
      l.parts.sort((a, b) => a.x - b.x);
      let out = '', end = null;
      for (const p of l.parts) { if (end !== null) out += (p.x - end > 8) ? ' | ' : (p.x - end > 1 ? ' ' : ''); out += p.s; end = p.x + p.w; }
      return out.trim();
    }).join('\n'));
  }
  return { pdf, pages };
}
function chunkText(pages, max = 14000) {
  const chunks = []; let cur = '';
  const push = () => { if (cur.trim()) chunks.push(cur); cur = ''; };
  for (const pg of pages) for (const line of pg.split('\n')) { if (cur.length + line.length + 1 > max) push(); cur += line + '\n'; }
  push();
  return chunks;
}

Extraé TODOS los productos que tengan precio. Respondé SOLO con JSON, con esta forma exacta:

- Si hay varias columnas de precio, usá SIEMPRE la última columna de precio de la derecha de cada fila (es la que usa el lubricentro), aunque haya otras.
- conIva: true si los precios que elegiste incluyen IVA; false si son netos/sin IVA; null si no se puede saber.
- codigo: código o artículo del proveedor; "" si no hay.

${isImage ? '' : '\nTexto:\n' + chunk}`;
}
function cleanRows(items) {
  const out = [];
  for (const r of (Array.isArray(items) ? items : [])) {
    let c, d, m, p;
    if (Array.isArray(r)) [c, d, m, p] = r;
    else if (r && typeof r === 'object') ({ codigo: c, descripcion: d, marca: m, precio: p } = r);
    else continue;
    if (typeof p === 'string') p = Number(p.replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
    p = Number(p);
    const clean = v => String(v ?? '').replace(/[\t\n\r]+/g, ' ').trim();
    d = clean(d);
    if (!d || !isFinite(p) || p <= 0) continue;
    out.push([clean(c), d, clean(m), Math.round(p * 100) / 100]);
  }
  return out;
}

    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const file = e.dataTransfer.files[0]; if (file) runImport(file); });
  }
}
function sampleErrorText(code) {
  return ({
    not_granted: 'Para leer listas automáticamente tenés que permitir que la página use Claude.',
    sampling_disabled: 'La lectura automática no está disponible en esta cuenta.',
    rate_limited: 'Claude está ocupado o llegaste al límite de uso. Probá de nuevo en un rato.',
    prompt_too_large: 'Una parte de la lista es demasiado grande. Probá dividir el PDF.',
    images_unavailable: 'Este PDF es escaneado (foto) y esta vista no puede enviar imágenes a Claude.',
    session_expired: 'Tu sesión venció. Volvé a iniciar sesión en Claude.',
    invalid_json: 'Claude no pudo ordenar una parte de la lista. Probá de nuevo.',
    refused: 'Claude no pudo procesar este archivo.',
  })[code] || 'Se cortó la lectura. Probá de nuevo.';
}
async function runImport(file) {
  const im = S.imp; if (!im) return;
  im.file = file; im.rows = []; im.conIva = null; im.msg = '';
  if (!S.sample) { im.msg = 'La lectura automática solo funciona abriendo la app desde Claude con tu cuenta. Si no, pasame la lista por el chat y la cargo yo.'; renderImport(); return; }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const ctl = new AbortController(); im.ctl = ctl;
  im.state = 'work'; im.msg = 'Abriendo archivo…'; im.prog = 0.02; renderImport();
  const pvName = provOf(im.provId)?.nombre || '';
  const seen = new Set(); const votes = [];
  const add = res => {
    if (res && typeof res === 'object' && !Array.isArray(res)) { if (res.conIva === true || res.conIva === false) votes.push(res.conIva); res = res.items; }
    for (const r of cleanRows(res)) { const key = r.join('|'); if (!seen.has(key)) { seen.add(key); im.rows.push(r); } }
  };
  try {
    let jobs = [];
    if (ext === 'pdf') {
      await loadPdf();
      const { pdf, pages } = await pdfPages(file, (i, n) => { im.msg = `Leyendo página ${i} de ${n}…`; im.prog = 0.02 + 0.08 * i / n; renderImport(); });
      const chars = pages.join('').replace(/\s/g, '').length;
      if (chars < pages.length * 60) {
        const lim = await S.sample.limits().catch(() => null);
        if (!lim?.images) throw { code: 'images_unavailable' };
        for (let i = 1; i <= pdf.numPages; i++) jobs.push({ page: i, pdf });
      } else jobs = chunkText(pages).map(t => ({ text: t }));
    } else if (['xlsx', 'xls', 'csv'].includes(ext)) {
      await loadXlsx();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      jobs = chunkText(wb.SheetNames.map(n => XLSX.utils.sheet_to_csv(wb.Sheets[n], { FS: ' | ', blankrows: false }))).map(t => ({ text: t }));
    } else { im.state = 'pick'; im.msg = 'Ese tipo de archivo no lo puedo leer. Usá PDF, Excel o CSV.'; renderImport(); return; }
    if (!jobs.length) throw { code: 'empty' };
    for (let j = 0; j < jobs.length; j++) {
      if (ctl.signal.aborted) throw { code: 'cancelled' };
      im.msg = jobs.length > 1 ? `Ordenando la lista · parte ${j + 1} de ${jobs.length}…` : 'Ordenando la lista…';
      im.prog = 0.1 + 0.9 * j / jobs.length; renderImport();
      const job = jobs[j];
      let res;
      if (job.text) res = await S.sample.json(promptFor(pvName, job.text, j + 1, jobs.length, false), { signal: ctl.signal, modelTier: 'default' });
      else {
        const page = await job.pdf.getPage(job.page);
        const vp = page.getViewport({ scale: 1.7 });
        const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
        res = await S.sample.json(promptFor(pvName, '', j + 1, jobs.length, true), { signal: ctl.signal, modelTier: 'default', images: [blob] });
      }
      add(res);
    }
    if (votes.length) { const t = votes.filter(Boolean).length; im.conIva = t >= votes.length - t; im.iva = im.conIva; }
    im.state = 'preview'; im.msg = im.rows.length ? 'Revisá que códigos y precios estén bien antes de guardar.' : 'No encontré productos con precio en este archivo.';
    renderImport();
  } catch (e) {
    if (!S.imp) return;
    if (e?.code === 'cancelled' || e?.name === 'AbortError') { im.state = im.rows.length ? 'preview' : 'pick'; im.msg = im.rows.length ? 'Lectura detenida: se muestran solo los productos leídos hasta ese momento.' : ''; renderImport(); return; }
    im.state = 'pick'; im.msg = e?.code === 'empty' ? 'El archivo parece vacío.' : (e?.code ? sampleErrorText(e.code) : 'No pude abrir el archivo. ¿Es un PDF o Excel válido?');
    renderImport();
  }
}
async function saveImport() {
  const im = S.imp; if (!im) return;
  const iva = $('#imp-iva')?.checked ?? im.iva;
  const { provId, rows } = im;
  const archivo = im.file?.name || '';
  im.state = 'saving'; renderImport();
  const ok = await guardar(st => {
    const p = st.provs.find(x => x.id === provId);
    Object.assign(p, { rows, iva, archivo, actualizado: new Date().toISOString() });
  }, `Lista guardada: ${rows.length.toLocaleString('es-AR')} productos`);
  if (!ok && S.imp) { im.state = 'preview'; im.msg = 'No se pudo guardar. Probá de nuevo.'; renderImport(); }
}

/* ---------- UI general ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3000); }

function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  for (const t of ['precios', 'prov', 'tar', 'aj']) $('#pane-' + t).hidden = t !== tab;
  if (tab === 'prov') renderProv();
  if (tab === 'tar') renderTar(true);
  if (tab === 'aj') { S.dirty.aj = false; renderAj(); }
  renderCartbar();
  window.scrollTo(0, 0);
}
function renderPrecios() { renderPaybar(); renderFilter(); renderAvisos(); renderView(); renderCartbar(); }

/* ---------- Aceite suelto (de tambor, se vende por litro) ---------- */
function renderView() {
  const su = S.view === 'suelto';
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  $('#paybar .search-box').hidden = su; $('#filtRow').hidden = su; $('#results').hidden = su; $('#sueltos').hidden = !su;
  if (su) renderSueltos(); else renderResults();
}
function renderSueltos() {
  if (S.view !== 'suelto') return;
  const box = $('#sueltos');
  const list = S.products.filter(p => p.suelto);
  const b = bancoActual();
  const cards = list.map(p => {
    const enCart = S.cart.find(x => x.u === p.u);
    const l = S.lit[p.u] ?? (enCart ? String(enCart.q).replace('.', ',') : '');
    const n = litros(l);
    const xl = precio(contado(p), S.mode, b, S.regular);
    const tot = n ? precio(contado(p) * n, S.mode, b, S.regular) : null;
    return `<div class="suelto${enCart ? ' picked' : ''}">
      <div class="suelto-top">
        <span><span class="item-desc">${esc(p.d)}</span>${p.m ? `<span class="item-meta">${brandHTML(p.m)}</span>` : ''}</span>
        <span class="item-price"><small>${esc(modeLabel(S.mode))} · por litro</small><b>${xl ? fmt(xl.total) : 'No disponible'}</b></span>
      </div>
      <div class="suelto-lit">
        <input class="input" data-lit="${esc(p.u)}" type="text" inputmode="decimal" placeholder="Litros" value="${esc(l)}" aria-label="Litros de ${esc(p.d)}">
        <button class="btn${n ? ' primary' : ''} small" data-act="addSuelto" data-id="${esc(p.u)}"${n ? '' : ' disabled'}>${enCart ? 'Actualizar carrito' : 'Agregar al carrito'}</button>
        <span class="tot" data-tot="${esc(p.u)}">${tot ? `${fmtL(n)}<b>${fmt(tot.total)}</b>${tot.c > 1 ? `<small>${tot.c} × ${fmt(tot.cuota)}</small>` : ''}` : ''}</span>
      </div>
    </div>`;
  }).join('');
  box.innerHTML = (list.length ? cards : `<div class="empty"><strong>Todavía no hay aceites sueltos cargados</strong><span>${S.canEdit ? 'Cargalos abajo con su precio por litro.' : 'Cuando el dueño los cargue, aparecen acá con su precio por litro.'}</span></div>`)
    + (S.canEdit ? editorSueltos() : '');
}
function editorSueltos() {
  const d = S.draftSue || (S.draftSue = clone(ST.sueltos));
  return `<div class="card">
    <h3 style="margin:0">Cargar aceites sueltos</h3>
    <p class="meta" style="margin:0">Precio final por litro en efectivo / transferencia (IVA incluido). Débito y cuotas se calculan con los recargos de cada tarjeta.</p>
    ${d.map((s, i) => `<div class="sedit">
      <label class="field">Aceite<input class="input" data-se="${i}" data-k="nombre" value="${esc(s.nombre)}" placeholder="Ej: Aceite 15W40 mineral"></label>
      <label class="field">Marca<input class="input" data-se="${i}" data-k="marca" value="${esc(s.marca)}" placeholder="YPF"></label>
      <label class="field">$ por litro<input class="input" data-se="${i}" data-k="litro" type="number" inputmode="decimal" min="0" step="1" value="${esc(s.litro)}"></label>
      <button class="btn small danger" data-act="delSuelto" data-id="${i}" aria-label="Borrar">Borrar</button>
    </div>`).join('')}
    <div class="row"><button class="btn small" data-act="newSuelto">+ Agregar aceite</button><button class="btn primary small" data-act="saveSueltos">Guardar aceites sueltos</button></div>
  </div>`;
}
function addSuelto(u) {
  const p = S.byU.get(u), n = litros(S.lit[u]);
  if (!p || !n) return;
  const x = S.cart.find(c => c.u === u);
  if (x) x.q = n; else S.cart.push({ u, d: p.d, q: n });
  delete S.lit[u];
  saveCart(); renderSueltos(); renderCartbar(); toast(`${p.d}: ${fmtL(n)} en el carrito`);
}
function saveSueltos() {
  const rows = (S.draftSue || []).map(s => ({ id: s.id || 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nombre: String(s.nombre || '').trim(), marca: String(s.marca || '').trim(), litro: Number(s.litro) || 0 }))
    .filter(s => s.nombre && s.litro > 0);
  guardar(st => { st.sueltos = rows; }, 'Aceites sueltos guardados');
}

shell();
rebuild();
renderPrecios();
S.cart = S.cart.filter(x => x && x.u && x.q > 0);

let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; S.open = null; S.limit = 60; renderResults(); }, 120); });
$('#provFilter').addEventListener('change', e => { S.provFilter = e.target.value; S.open = null; S.limit = 60; renderResults(); });
$('#pane-precios').addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { S.view = v.dataset.view; lsSet('view', S.view); renderView(); return; }
  const m = e.target.closest('[data-mode]');
  if (m) { S.mode = m.dataset.mode; lsSet('mode', S.mode); renderPaybar(); renderView(); renderCartbar(); return; }
  if (e.target.closest('#regBtn')) { S.regular = !S.regular; lsSet('regular', S.regular ? '1' : '0'); renderPaybar(); renderView(); renderCartbar(); }
});
$('#pane-precios').addEventListener('change', e => {
  if (e.target.id === 'bancoSel') {
    S.banco = e.target.value; lsSet('banco', S.banco);
    if (S.mode === 'ef') { S.mode = '1'; lsSet('mode', S.mode); }
    renderPaybar(); renderView(); renderCartbar();
  }
});
$('#sueltos').addEventListener('input', e => {
  const li = e.target.closest('[data-lit]');
  if (li) {
    const u = li.dataset.lit, p = S.byU.get(u); S.lit[u] = li.value;
    const n = litros(li.value), tot = n && p ? precio(contado(p) * n, S.mode, bancoActual(), S.regular) : null;
    $(`[data-tot="${CSS.escape(u)}"]`).innerHTML = tot ? `${fmtL(n)}<b>${fmt(tot.total)}</b>${tot.c > 1 ? `<small>${tot.c} × ${fmt(tot.cuota)}</small>` : ''}` : '';
    const bt = li.parentNode.querySelector('[data-act="addSuelto"]'); bt.disabled = !n; bt.classList.toggle('primary', !!n);
    return;
  }
  const se = e.target.closest('[data-se]');
  if (se && S.draftSue) S.draftSue[+se.dataset.se][se.dataset.k] = se.value;
});
$('#sueltos').addEventListener('keydown', e => { const li = e.target.closest('[data-lit]'); if (li && e.key === 'Enter') addSuelto(li.dataset.lit); });
$('#results').addEventListener('click', e => {
  const pk = e.target.closest('[data-pick]');
  if (pk) { togglePick(pk.dataset.pick); return; }
  const h = e.target.closest('.item-head');
  if (h) { S.open = S.open === h.dataset.u ? null : h.dataset.u; renderResults(); }
});
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#cartbar').addEventListener('click', e => { if (e.target.closest('#openCart')) openCart(); });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' && !S.imp) closeSheet(); });
$('#sheetBody').addEventListener('click', e => {
  const q = e.target.closest('[data-q]');
  if (q) {
    const x = S.cart[+q.dataset.q]; if (!x) return;
    x.q = Math.round((x.q + Number(q.dataset.d)) * 100) / 100;
    if (x.q <= 0) S.cart.splice(+q.dataset.q, 1);
    saveCart(); renderCart(); renderView(); renderCartbar();
  }
});
$('#sheetBody').addEventListener('input', onPresInput);
$('#sheetBody').addEventListener('change', e => { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onPresInput(e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden && !S.imp) closeSheet(); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'addProv': addProv(); break;
    case 'edit': S.editProv = id; renderProv(); break;
    case 'cancelEdit': S.editProv = null; renderProv(); break;
    case 'saveProv': saveProv(id); break;
    case 'del': delProv(id); break;
    case 'import': openImport(id); break;
    case 'closeSheet': closeSheet(); break;
    case 'pres': openPres(); break;
    case 'more': S.limit += 60; renderResults(); break;
    case 'addSuelto': addSuelto(id); break;
    case 'newSuelto': S.draftSue.push({ id: '', nombre: '', marca: '', litro: '' }); renderSueltos(); break;
    case 'delSuelto': S.draftSue.splice(+id, 1); renderSueltos(); break;
    case 'saveSueltos': saveSueltos(); break;
    case 'backCart': S.presOpen = false; openCart(); break;
    case 'printPres': printPres(); break;
    case 'pdfPres': pdfPres(); break;
    case 'clearCart': S.cart = []; saveCart(); renderCart(); renderView(); renderCartbar(); break;
    case 'stopImp': S.imp?.ctl?.abort(); break;
    case 'saveImp': saveImport(); break;
    case 'addBanco': S.draftTar.push(blankBanco('Nueva tarjeta')); S.dirty.tar = true; renderTar(); break;
    case 'delBanco': S.draftTar.splice(+b.dataset.b, 1); S.dirty.tar = true; renderTar(); break;
    case 'saveTar': saveTar(); break;
    case 'saveAj': saveAj(); break;
  }
});
$('#pane-tar').addEventListener('input', onTarInput);
$('#pane-tar').addEventListener('change', e => { if (e.target.type === 'checkbox') onTarInput(e); });
$('#pane-aj').addEventListener('input', () => { S.dirty.aj = true; const s = $('#pane-aj [data-act="saveAj"]'); if (s) s.disabled = false; });
$('#pane-aj').addEventListener('change', () => { S.dirty.aj = true; const s = $('#pane-aj [data-act="saveAj"]'); if (s) s.disabled = false; });

/* ---------- Arranque: el dueño (logueado en Claude) puede editar ---------- */
(async () => {
  const flash = ssGet('flash');
  if (flash) toast(flash);
  const use = n => (window.claude && claude.use) ? claude.use(n).catch(() => null) : Promise.resolve(null);
  const [user, art] = await Promise.all([use('user'), use('artifact')]);
  const canEdit = user ? await Promise.resolve(user.canEdit()).catch(() => false) : false;
  if (!canEdit || !art) return;
  S.canEdit = true; S.art = art;
  $('#nav').hidden = false;
  use('sample').then(s => { S.sample = s; });
  if (!S.products.length) renderResults();
  renderSueltos();
  const tab = ssGet('tab');
  if (tab && tab !== 'precios') setTab(tab);
})();
</script>
